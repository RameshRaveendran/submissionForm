<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>form validation and submission</title>
    <link rel="stylesheet" href="./style.css">
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <script type="text/javascript">
        (function () {

            emailjs.init({
                publicKey: "NpL4UwX17y3tl54lo",
            });
        })();
    </script>
    <script type="text/javascript">

    </script>
</head>

<body>
    <div class="container">
        <div class="formdiv">
            <div class="logo">
                <img src="./images/icons8-r-100 (1).png" alt="">
            </div>
            <div class="formitems">
                <form id="contact-form" action="">

                    <input 
                    name="name"
                    type="text" 
                    class="form-control" 
                    id="from_name" 
                    placeholder="Your Name" 
                    required>
                    <br>

                    <input  
                    
                    type="text" 
                    placeholder="Email" 
                    class="form-control" 
                    id="email" 
                    name="email" 
                    required>
                    <br>

                    <input 
                    name="subject"
                    type="text" 
                    class="form-control" 
                    id="subject" 
                    placeholder="subject" 
                    required>
                    <br>

                    <textarea 
                    name="message"
                    id="message" 
                    class="form-control" 
                    placeholder="message"
                    style="resize: both; min-width: 150px; min-height: 100px;" 
                    required></textarea>
                    <br>

                    <button type="submit " id="submit">Submit</button>
                    <div style="color: aliceblue;" id="formStatus"></div>
                </form>
            </div>
        </div>
    </div>
    <!-- script -->

    <script src="./index.js"></script>
</body>

</html>
